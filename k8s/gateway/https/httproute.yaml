apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-plugin
  namespace: 5stack
spec:
  parentRefs:
    - name: example-plugin
      sectionName: https
  hostnames:
    - ${EXAMPLE_PLUGIN_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: example-plugin
          port: 80
