# Both of the shared Gateway's listeners: a proxy may forward to the node over
# HTTP on 80 or HTTPS on 443.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: example-plugin
  namespace: 5stack
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure
  hostnames:
    - ${EXAMPLE_PLUGIN_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: example-plugin
          port: 80
